<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#0f1216;--panel:#161b22;--edge:#2a313c;--fg:#e6edf3;--mut:#9aa4b2;--accent:#4da3ff;--chip:#1d2530}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100vh}
header{padding:8px 14px;border-bottom:1px solid var(--edge);display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600}
.sub{color:var(--mut);font-size:12px}
.gc{display:flex;align-items:center;gap:6px;color:var(--mut)}
.gc input[type=range]{width:96px}
button{background:var(--panel);color:var(--fg);border:1px solid var(--edge);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px}
button:hover{border-color:var(--accent)}
.patrow{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--chip);border:1px solid var(--edge);border-radius:5px;padding:2px 7px;font-size:11px;white-space:nowrap}
.chip b{color:var(--accent);font-weight:600;margin-right:3px}
.chip.warn b{color:#ff8a5b}
.panels{flex:1;display:flex;gap:1px;background:var(--edge);min-height:0}
.panel{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0;position:relative}
.pbar{padding:6px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--edge);background:var(--panel)}
.pbar .cat{color:var(--mut);font-size:11px;white-space:nowrap}
.combo{position:relative;flex:1;max-width:320px}
.combo-input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--edge);border-radius:6px;padding:6px 9px;font-size:12px;cursor:pointer;text-align:left}
.combo-input:hover{border-color:var(--accent)}
.combo-pop{position:absolute;z-index:20;top:calc(100% + 3px);left:0;right:0;background:var(--panel);border:1px solid var(--accent);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);overflow:hidden}
.combo-search{width:100%;background:var(--bg);color:var(--fg);border:none;border-bottom:1px solid var(--edge);padding:8px 10px;font-size:12px;outline:none}
.combo-list{max-height:320px;overflow:auto}
.combo-item{padding:6px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid rgba(128,128,128,.08)}
.combo-item:hover{background:var(--accent);color:#fff}
.combo-item.sel{color:var(--accent);font-weight:600}
.combo-item.hdr{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.05em;cursor:default;background:transparent;padding:6px 10px 2px}
.combo-item.hdr:hover{background:transparent;color:var(--mut)}
.pbody{flex:1;display:flex;min-height:0}
.cvwrap{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
.legend{width:214px;flex:none;overflow:auto;background:var(--panel);border-left:1px solid var(--edge);padding:12px;color:var(--fg)}
.legend .lt{font-weight:600;margin-bottom:5px;font-size:12px}
.legend .li{display:flex;align-items:center;gap:7px;margin:3px 0;font-size:11.5px;color:var(--fg)}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(128,128,128,.35);cursor:pointer}
.legend .sw:hover{outline:2px solid var(--accent);outline-offset:1px}
.legend .cnt{color:var(--mut);font-size:10.5px}
.legend .li[data-cat]{cursor:pointer;border-radius:4px;padding:1px 3px;user-select:none}
.legend .li[data-cat]:hover{background:var(--chip)}
.legend .li.hid{opacity:.34;text-decoration:line-through}
.legend .li.hi{outline:2px solid var(--accent);outline-offset:-2px;font-weight:600}
.legend .lt[data-reset]{cursor:pointer}
.legend .lhint{color:var(--mut);font-size:9.5px;margin:2px 0 6px;font-style:italic}
.l2h{display:flex;align-items:center;gap:7px;margin:8px 0 2px;font-size:12px;font-weight:600;cursor:pointer;user-select:none;border-radius:4px;padding:1px 3px;color:var(--fg)}.l2h:hover{background:var(--chip)}.l2h.hid{opacity:.34;text-decoration:line-through}.l2h.part .cnt::after{content:" · some hidden"}.l2h .sw2{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(128,128,128,.35)}.li.l3{margin-left:15px}

.cbar{width:154px;height:12px;border-radius:3px;margin:5px 0;border:1px solid var(--edge)}
.cbnums{display:flex;justify-content:space-between;color:var(--mut);font-size:10px}
.note{color:var(--mut);font-size:10.5px;margin-top:3px}
.corerow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crhdr{color:var(--mut);font-size:11px}
.ctag{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--edge);border-left:4px solid var(--cc,var(--mut));border-radius:6px;padding:3px 8px;font-size:11px;white-space:nowrap;cursor:pointer;user-select:none}
.ctag:hover{border-color:var(--accent);border-left-color:var(--cc,var(--mut))}
.ctag b{color:var(--cc,var(--fg));font-weight:700}
.ctag .cclin{color:var(--fg)}
.ctag .cnt{color:var(--mut);font-size:10px}
.ctag.off{opacity:.42}
.ctag.off .cclin{text-decoration:line-through}
.ctag.na{opacity:.55;cursor:default;font-style:italic}
.ctag input{margin:0;cursor:pointer}
.crlegend{display:inline-flex;align-items:center;gap:5px;color:var(--mut);font-size:10.5px}
.crlegend i{width:15px;border-top:3px solid;display:inline-block;vertical-align:middle}
.crbtn{font-size:10.5px;padding:2px 7px}
.tt{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--accent);border-radius:6px;padding:6px 9px;font-size:11px;z-index:30;display:none;max-width:240px;box-shadow:0 3px 12px rgba(0,0,0,.4)}
.tt b{color:var(--accent)}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--panel:#fff;--edge:#d0d7de;--fg:#1f2328;--mut:#57606a;--chip:#eef1f4}}
:root[data-theme=dark]{--bg:#0f1216;--panel:#161b22;--edge:#2a313c;--fg:#e6edf3;--mut:#9aa4b2;--chip:#1d2530}
:root[data-theme=light]{--bg:#f6f8fa;--panel:#fff;--edge:#d0d7de;--fg:#1f2328;--mut:#57606a;--chip:#eef1f4}
</style><style>#he-panel{flex:0 0 45%;min-width:280px;display:flex;flex-direction:column;background:var(--panel);border-left:2px solid var(--accent);min-height:0}
#he-panel header{padding:8px 10px;gap:7px;max-height:44%;overflow:auto}
#he-panel h2{margin:0;font-size:15px}#he-panel select{max-width:100%;background:var(--bg);color:var(--fg);padding:6px;border:1px solid var(--edge);border-radius:5px;width:100%}
#he-panel .he-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}#he-note{padding:7px;background:#553811;color:#ffe2ae;border-radius:5px;white-space:pre-wrap}#he-details{font-size:11px;color:var(--mut)}
#he-stage{flex:1;min-height:160px;overflow:hidden;position:relative;background:#ddd;touch-action:none;cursor:grab}#he-stage img{position:absolute;left:50%;top:50%;width:auto;height:auto;max-width:none;max-height:none;transform-origin:center;user-select:none;pointer-events:none}#he-stage:active{cursor:grabbing}
#he-panel footer{padding:8px;font-size:11px;color:var(--mut)}#he-panel textarea{width:100%;height:42px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--edge)}
.he-single .panels>.panel:nth-child(2){display:none}#he-toggle{margin-left:auto}#he-panel[hidden]{display:none}.he-controls-label{font-size:11px;color:var(--mut)}
@media(max-width:850px){body.he-open #app{height:auto;min-height:100vh}body.he-open .panels{flex-wrap:wrap;overflow:visible}body.he-open .panels>.panel{flex:1 1 100%;height:65vh}body.he-open #he-panel{flex:1 1 100%;height:85vh}#he-panel header{max-height:50%}body.he-open .legend{width:140px}}
</style></head>
<body><div id="app">
<header>
 <div class="hrow">
  <h1>__TITLE__</h1><span class="sub" id="finfo">—</span>
  <span class="gc">size <input type="range" id="psz" min="1" max="9" step="0.5" value="3.5"></span>
  <span class="gc">opacity <input type="range" id="pop" min="0.2" max="1" step="0.05" value="0.9"></span>
  <span class="gc" id="gmaxwrap" style="display:none">gene max <input type="range" id="gmax" min="5" max="100" step="1" value="100"><span id="gmaxlbl" style="font-size:10px;color:var(--mut)">100%</span></span>
  <span class="gc"><label style="cursor:pointer;user-select:none"><input type="checkbox" id="tlschk" style="vertical-align:middle"> __REGION_TOGGLE__</label></span>
  <span class="gc"><label style="cursor:pointer;user-select:none"><input type="checkbox" id="framechk" checked style="vertical-align:middle"> Core frames</label></span>
  <button id="reset">Reset view</button>
  <span class="sub">wheel=zoom · drag=pan · synced · hover=cell</span>
 </div>
 <div class="patrow" id="patinfo"></div>
 <div class="corerow" id="coreinfo"></div>
</header>
<div class="panels">
 <div class="panel"><div class="pbar"><span class="cat">Left</span>
   <div class="combo"><button class="combo-input" id="ci0"></button><div class="combo-pop" id="cp0" hidden><input class="combo-search" id="cs0" placeholder="search cell type / gene / channel…"><div class="combo-list" id="cl0"></div></div></div></div>
  <div class="pbody"><div class="cvwrap"><canvas id="c0"></canvas></div><div class="legend" id="lg0"></div></div></div>
 <div class="panel"><div class="pbar"><span class="cat">Right</span>
   <div class="combo"><button class="combo-input" id="ci1"></button><div class="combo-pop" id="cp1" hidden><input class="combo-search" id="cs1" placeholder="search cell type / gene / channel…"><div class="combo-list" id="cl1"></div></div></div></div>
  <div class="pbody"><div class="cvwrap"><canvas id="c1"></canvas></div><div class="legend" id="lg1"></div></div></div>
</div>
<div class="tt" id="tt"></div>
</div>
<script>
const DATA=/*__DATA__*/; const CFG=/*__CONFIG__*/; const N=DATA.n;
const HIDDEN_DEFAULT=new Set(CFG.hiddenDefault||[]);function hiddenState(){return new Map([...HIDDEN_DEFAULT].map(v=>[v,2]))}
const LEVELS=CFG.levelLabels||["Cell type · L1","Cell type · L2","Cell type · L3"];const STORE=CFG.storagePrefix||"tmaviewer";
const MAJORPAL=CFG.palette||{};
const PAL20=["#4363d8","#3cb44b","#f58231","#911eb4","#42d4f4","#f032e6","#bfef45","#fabed4","#469990","#dcbeff","#9A6324","#800000","#aaffc3","#808000","#ffd8b1","#000075","#e6194B","#a9a9a9","#ffe119","#00d0b0"];
function buildPal(vals){const u=[...new Set(vals)].sort();const m={};let i=0;u.forEach(v=>{if(MAJORPAL[v])m[v]=MAJORPAL[v];else if(HIDDEN_DEFAULT.has(v))m[v]="#d9d9d9";else{m[v]=PAL20[i%20];i++}});return m}
const CATS={"__type__":{label:LEVELS[0],vals:DATA.type},"__subtype__":{label:LEVELS[2],vals:DATA.subtype},"__subL2__":{label:LEVELS[1],vals:DATA.subL2}};
Object.values(CATS).forEach(c=>c.pal=buildPal(c.vals));
// --- editable palette: click a legend swatch to recolor a cell type (persisted) ---
const PAL_LS_KEY=STORE+"_pal_overrides_v1";let PAL_OVERRIDE={};try{PAL_OVERRIDE=JSON.parse(localStorage.getItem(PAL_LS_KEY)||"{}")||{}}catch(e){PAL_OVERRIDE={}}
Object.keys(CATS).forEach(k=>{const o=PAL_OVERRIDE[k];if(o)Object.keys(o).forEach(v=>{CATS[k].pal[v]=o[v]})});
const _colorInput=document.createElement("input");_colorInput.type="color";_colorInput.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0";document.body.appendChild(_colorInput);
let _colorTarget=null;
function _toHex(c){if(!c)return"#888888";if(c[0]==="#"){return c.length===4?("#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]):c.slice(0,7)}const m=c.match(/\d+/g);return(m&&m.length>=3)?("#"+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,"0")).join("")):"#888888"}
_colorInput.addEventListener("input",()=>{if(!_colorTarget)return;const t=_colorTarget;CATS[t.catKey].pal[t.val]=_colorInput.value;(PAL_OVERRIDE[t.catKey]=PAL_OVERRIDE[t.catKey]||{})[t.val]=_colorInput.value;try{localStorage.setItem(PAL_LS_KEY,JSON.stringify(PAL_OVERRIDE))}catch(e){}panels.forEach(pp=>{if((FEATS.find(x=>x.k===pp.feat)||{}).k===t.catKey)drawP(pp)})});

const VIR=[[68,1,84],[72,40,120],[62,74,137],[49,104,142],[38,130,142],[31,158,137],[53,183,121],[110,206,88],[181,222,43],[253,231,37]];
function viridis(t){t=Math.max(0,Math.min(1,t));const x=t*9,i=Math.floor(x),f=x-i,a=VIR[i],b=VIR[Math.min(9,i+1)];return`rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`}
const RNG={};function range(arr){const s=arr.filter(v=>v>0).slice().sort((a,b)=>a-b);if(!s.length)return[0,1];const lo=s[Math.floor(s.length*0.02)],hi=s[Math.floor(s.length*0.98)]||s[s.length-1];return[lo,hi>lo?hi:lo+1]}
// channel ranges for RGB modes
const CHN={};["PanCK","CD45","DAPI","Membrane","G"].forEach(c=>{if(DATA.channels[c])CHN[c]=range(DATA.channels[c])});
function nrm(v,r){return Math.max(0,Math.min(1,(v-r[0])/(r[1]-r[0])))}
function rgbRaw(i){const r=nrm(DATA.channels.PanCK[i],CHN.PanCK),g=nrm(DATA.channels.CD45[i],CHN.CD45),b=nrm(DATA.channels.DAPI[i],CHN.DAPI);return`rgb(${r*255|0},${g*255|0},${b*255|0})`}
function rgbPath(i){const h=nrm(DATA.channels.DAPI[i],CHN.DAPI),e=nrm(DATA.channels.PanCK[i],CHN.PanCK);const R=255*(1-0.55*h-0.05*e),G=255*(1-0.72*h-0.55*e),B=255*(1-0.20*h-0.28*e);return`rgb(${Math.max(0,R)|0},${Math.max(0,G)|0},${Math.max(0,B)|0})`}
// feature registry
const FEATS=[{k:"__he__",label:"H&E",kind:"he",grp:"Morphology image"},{k:"__type__",kind:"cat",grp:"Cell types"},{k:"__subL2__",kind:"cat",grp:"Cell types"},{k:"__subtype__",kind:"cat",grp:"Cell types"}];
if(DATA.rawImage) FEATS.push({k:"__rawimg__",label:"RAW morphology — CellComposite image",kind:"rawimg",grp:"Morphology image"});
if(!Object.keys(DATA.heImages||{}).length)FEATS.splice(FEATS.findIndex(f=>f.k==="__he__"),1);
FEATS.push({k:"__rgbpath__",label:"Virtual H&E-like colors (computed, not histology)",kind:"rgbpath",grp:"Composite RGB"});
FEATS.filter(f=>CATS[f.k]).forEach(f=>f.label=CATS[f.k].label);
Object.keys(DATA.channels).forEach(c=>FEATS.push({k:"ch:"+c,label:"Channel · "+c,kind:"num",arr:DATA.channels[c],grp:"IF channels"}));
// --- ALL-gene sparse store (base64 UInt8 codes, per-gene max) ---
function _b64b(x){const bin=atob(x),n=bin.length,b=new Uint8Array(n);for(let i=0;i<n;i++)b[i]=bin.charCodeAt(i);return b}
let GS=null,GMAX=null,GNAMES=null,GLIM=1.0;
if(DATA.geneSparse){const g=DATA.geneSparse;GS={indptr:new Int32Array(_b64b(g.indptr).buffer),idx:new Uint16Array(_b64b(g.indices).buffer),val:_b64b(g.data)};GMAX=g.geneMax;GNAMES=g.names;GNAMES.forEach((nm,gi)=>FEATS.push({k:"g:"+nm,label:"Gene · "+nm,kind:"gene",gi:gi,grp:"Genes ("+GNAMES.length+")"}));}
else if(DATA.genes){Object.keys(DATA.genes).forEach(g=>FEATS.push({k:"g:"+g,label:"Gene · "+g,kind:"num",arr:DATA.genes[g],grp:"Genes ("+Object.keys(DATA.genes).length+")"}));}
const _geneCache={};
function geneCodes(gi){if(_geneCache[gi])return _geneCache[gi];const out=new Float32Array(N),ip=GS.indptr,ix=GS.idx,vl=GS.val;for(let r=0;r<N;r++){for(let k=ip[r];k<ip[r+1];k++){if(ix[k]===gi){out[r]=vl[k]*(DATA.geneMaxBySource[DATA.geneSource[r]][gi]/(GMAX[gi]||1));break}}}_geneCache[gi]=out;return out}
function viridisR(t){return viridis(1-Math.max(0,Math.min(1,t)))}
// --- TMA core frames + per-core clinical annotation ---------------------------
// One physical tissue piece = one frame. Sub-cores of the same punch SHARE the
// core_id, so they share one label, one clinical record, one header tag and one
// show/hide checkbox (e.g. one punch that lies on the slide as two separate pieces).
const CORES=DATA.cores||[];
const CORE_GROUPS=CFG.coreGroups||{};
const coreCol=c=>(CORE_GROUPS[c.group]||{}).color||"#9aa4b2";
const CORE_IDS=[...new Set(CORES.map(c=>c.id))];
const shownCore={};CORE_IDS.forEach(id=>shownCore[id]=true);
let showFrames=true;
const COREIDX=new Int16Array(N);
(function(){const mp=DATA.coreFov||{};for(let i=0;i<N;i++){const v=mp[DATA.fov[i]];COREIDX[i]=(v===undefined?-1:v)}})();
const coreHidden=i=>{const c=COREIDX[i];return c>=0&&!shownCore[CORES[c].id]};
function coreAgg(id){const ss=CORES.filter(c=>c.id===id);return{c:ss[0],n:ss.reduce((a,b)=>a+b.n,0),nfov:ss.reduce((a,b)=>a+b.nfov,0),parts:ss.length}}
function coreTip(c){const g=coreAgg(c.id);const pc=c.nparts>1?` <span style="color:var(--mut)">piece ${c.part} of ${c.nparts}</span>`:"";
 return `<b style="color:${coreCol(c)}">${c.id}</b>${pc}${(c.lines||[]).map(l=>"<br>"+l).join("")}<br><span style="color:var(--mut)">${c.n.toLocaleString()} cells · ${c.nfov} FOVs${c.nparts>1?` · core total ${g.n.toLocaleString()}`:""}</span>`}
function maskHiddenCores(p,bg){if(!CORES.length)return;const ctx=p.ctx;ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=bg;CORES.forEach(c=>{if(shownCore[c.id])return;const s=c.slot;ctx.fillRect(SX(s[0]),SY(s[1]),(s[2]-s[0])*view.s,(s[3]-s[1])*view.s)});ctx.restore()}
function drawCores(p){p.labelRects=[];if(!CORES.length||!showFrames)return;const ctx=p.ctx;ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);
 const grow=PSZ+2;ctx.font='bold 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';ctx.textBaseline="middle";ctx.textAlign="center";
 CORES.forEach((c,ci)=>{if(!shownCore[c.id])return;const col=coreCol(c);
  const X0=SX(c.box[0])-grow,Y0=SY(c.box[1])-grow,X1=SX(c.box[2])+grow,Y1=SY(c.box[3])+grow;
  if(X1<-60||X0>p.W+60||Y1<-60||Y0>p.H+60)return;
  const tw=ctx.measureText(c.nparts>1?c.id+" · piece "+c.part:c.id).width,half=tw/2+7;
  let lx=(X0+X1)/2;const loA=Math.max(X0,0)+half+2,hiA=Math.min(X1,p.W)-half-2;
  if(hiA>loA)lx=Math.min(Math.max(lx,loA),hiA);
  const ly=Math.min(Math.max(Y0,15),p.H-7),clamped=Math.abs(ly-Y0)>0.5;
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.beginPath();                                  // 3 full sides + broken top
  ctx.moveTo(X0,Y0);ctx.lineTo(X0,Y1);ctx.lineTo(X1,Y1);ctx.lineTo(X1,Y0);
  if(clamped){ctx.lineTo(X0,Y0)}else{ctx.lineTo(lx+half,Y0);ctx.moveTo(lx-half,Y0);ctx.lineTo(X0,Y0)}
  ctx.stroke();
  const bw=tw+12,bh=15;                             // label pill (legible over morphology)
  ctx.fillStyle=getComputedStyle(document.body).backgroundColor||"#0f1216";
  ctx.fillRect(lx-bw/2,ly-bh/2,bw,bh);
  if(clamped){ctx.strokeStyle=col;ctx.lineWidth=1;ctx.strokeRect(lx-bw/2,ly-bh/2,bw,bh)}
  ctx.fillStyle=col;ctx.fillText(c.nparts>1?c.id+" · piece "+c.part:c.id,lx,ly+0.5);
  p.labelRects.push({x0:lx-bw/2,y0:ly-bh/2,x1:lx+bw/2,y1:ly+bh/2,ci:ci})});
 ctx.restore()}
function coreLabelAt(p,mx,my){const L=p.labelRects||[];for(let i=L.length-1;i>=0;i--){const r=L[i];if(mx>=r.x0&&mx<=r.x1&&my>=r.y0&&my<=r.y1)return r.ci}return -1}
function renderCoreTags(){const box=document.getElementById("coreinfo");if(!box)return;
 if(!CORES.length){box.style.display="none";return}
 const legend=Object.keys(CORE_GROUPS).length?`<span class="crlegend">${Object.values(CORE_GROUPS).map((g,i)=>`<i style="border-color:${g.color}${i?";margin-left:6px":""}"></i>${g.label}`).join("")}</span>`:"";
